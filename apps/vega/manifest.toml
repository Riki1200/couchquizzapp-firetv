# Couch Quiz — Vega app manifest.
# Only what the game uses: the TV keyboard, remote input, network, audio playback
# (w3cmedia AudioPlayer for sound effects) and AsyncStorage (saved settings).
# The build adds a [[needs.module]] entry per native module it bundles.
schema-version = 1

[package]
title = "Couch Quiz"
icon = "@image/icon.png"
version = "0.1.0"
id = "com.romeodev.couchquiz"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "com.romeodev.couchquiz.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[processes]
[[processes.group]]
component-ids = ["com.romeodev.couchquiz.main"]

## ------------------------------------------------------------------------------
## Wants - optional capabilities
## ------------------------------------------------------------------------------
[wants]
# On-screen keyboard (custom topic)
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

# Audio playback for sound effects and music (w3cmedia AudioPlayer)
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# Network information
[[wants.service]]
id = "com.amazon.network.service"

# Accessibility
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

## ------------------------------------------------------------------------------
## Needs - required capabilities
## ------------------------------------------------------------------------------
[needs]
[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_2@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_1"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

## ------------------------------------------------------------------------------
## Offers
## ------------------------------------------------------------------------------
[offers]
# Required for the audio pipeline (GIPC)
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "com.romeodev.couchquiz.main"

[[offers.module]]
id = "/com.romeodev.couchquiz.main@IMod1"
includes-messages = ["pkg://com.romeodev.couchquiz.main"]

[[message]]
uri = "pkg://com.romeodev.couchquiz.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
